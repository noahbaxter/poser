<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poser</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="plugin">
        <div class="nav-bar">
            <div class="tab-row" id="tab-row"></div>
            <div class="group-bar-slot" id="group-bar-slot"></div>
        </div>
        <div class="selector-area" id="selector-area"></div>

        <div class="bottom-area">
            <div class="controls-left">
                <div class="controls-group">
                    <div class="master-group">
                        <div class="master-label">LO CUT</div>
                        <div class="master-slot" id="knob-low-cut"></div>
                    </div>
                    <div class="master-group">
                        <div class="master-label">HI CUT</div>
                        <div class="master-slot" id="knob-high-cut"></div>
                    </div>
                    <div class="master-group">
                        <div class="master-label">FLT</div>
                        <div class="master-slot" id="cab-filter-slot"></div>
                    </div>
                </div>
                <div class="controls-group">
                    <div class="master-group">
                        <div class="master-label">CMP</div>
                        <div class="master-slot" id="gain-comp-slot"></div>
                    </div>
                    <div class="master-group">
                        <div class="master-label">TRIM</div>
                        <div class="master-slot" id="master-trim"></div>
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="master-group">
                    <div class="master-label">SCALE</div>
                    <div class="master-slot" id="master-push"></div>
                </div>
                <div class="blend-panel" id="blend-panel"></div>
            </div>
        </div>
        <div class="version-label" id="version-num"></div>
        <div class="eq-toggle" id="eq-toggle">EQ &#x25BE;</div>
    </div>

    <div class="eq-viewer" id="eq-viewer"></div>

    <div class="knob-tooltip" id="knob-tooltip"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
