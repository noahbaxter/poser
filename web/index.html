<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poser EQ</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Poser EQ</h1>
        <div class="version" id="version-num"></div>

        <div class="control-group">
            <label for="gain-slider">Gain</label>
            <input type="range" id="gain-slider" min="0" max="1" step="0.001" value="0.5">
            <span class="value-display" id="gain-value">0.0 dB</span>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
