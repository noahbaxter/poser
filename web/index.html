<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poser</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="plugin">
        <!-- Tab labels -->
        <div class="tab-row">
            <div class="tab active" data-tab="mic">MIC</div>
            <div class="tab" data-tab="cab">CAB</div>
            <div class="tab" data-tab="speaker">SPK</div>
            <div class="tab" data-tab="position">POS</div>
        </div>

        <!-- Blend knobs (one per section) -->
        <div class="blend-row">
            <div class="blend-slot" id="blend-mic"></div>
            <div class="blend-slot" id="blend-cab"></div>
            <div class="blend-slot" id="blend-speaker"></div>
            <div class="blend-slot" id="blend-position"></div>
        </div>

        <!-- Big selector knob area -->
        <div class="selector-area">
            <div class="selector-panel active" id="panel-mic"></div>
            <div class="selector-panel" id="panel-cab"></div>
            <div class="selector-panel" id="panel-speaker"></div>
            <div class="selector-panel" id="panel-position"></div>
        </div>

        <!-- Bottom controls -->
        <div class="bottom-row">
            <div class="master-group">
                <div class="master-label">LO CUT</div>
                <div class="master-slot" id="knob-low-cut"></div>
            </div>
            <div class="master-group push-group">
                <div class="master-label">SCALE</div>
                <div class="master-slot" id="master-push"></div>
            </div>
            <div class="master-group">
                <div class="master-label">TRIM</div>
                <div class="master-slot" id="master-trim"></div>
            </div>
            <div class="master-group">
                <div class="master-label">HI CUT</div>
                <div class="master-slot" id="knob-high-cut"></div>
            </div>
        </div>
    </div>

    <div class="knob-tooltip" id="knob-tooltip"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
